<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Vegas Portal – Promotion Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300&amp;display=swap">
<style>body{margin:0;background:#efede7}
a{color:#624f3d}a:hover{color:#3d3025}
button{font-family:inherit}
button:focus-visible{outline:2px solid #624f3d;outline-offset:2px}
.hero button:focus-visible{outline-color:#f1ca6d}</style>
</head>
<body>
<div id="app"></div>
<template id="tpl-Main">

<div style="font-family: Montserrat, sans-serif; color: #4d3d2e; background: linear-gradient(180deg,#efede7,#faf8f4); min-height: 100%; padding-bottom: 56px">

  <!-- HERO -->
  <header class="hero" style="{{heroStyle}}">
    <div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 22px">
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px">
        <div style="display: flex; align-items: center; gap: 12px">
          <svg width="14" height="27" viewBox="0 0 140 267.68" aria-hidden="true"><path d="M70 0 C 80 70, 105 110, 140 133.84 C 105 157.68, 80 197.68, 70 267.68 C 60 197.68, 35 157.68, 0 133.84 C 35 110, 60 70, 70 0 Z" fill="#ed1c24"></path></svg>
          <span style="font-size: 12px; font-weight: 600; letter-spacing: .22em; color: rgba(255,255,255,.88)">VEGAS PORTAL · PROMOTION</span>
          <span style="font-size: 10px; font-weight: 700; letter-spacing: .08em; padding: 4px 10px; border-radius: 999px; color: #3d3025; background: #f1ca6d">V2 · EXCL. HIDDEN JACKPOT</span>
        </div>
      </div>
      <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 20px">
        <sc-if value="{{notAlloc}}" hint-placeholder-val="{{ true }}">
        <div style="display: flex; flex-direction: column; gap: 6px">
          <h1 style="margin: 0; font-size: 34px; line-height: 1.1; font-weight: 700; letter-spacing: .04em">DAILY TRACKING REPORT</h1>
          <p style="margin: 0; font-size: 14px; font-weight: 300; font-style: italic; color: rgba(255,255,255,.88)">Updated November 18, 2026 · 06:00 AM</p>
        </div>
        </sc-if>
        <div role="tablist" aria-label="Period" style="display: flex; gap: 4px; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.10); box-shadow: inset 0 1px 0 rgba(255,255,255,.35), inset 0 0 0 1px rgba(255,255,255,.14), 0 6px 16px -8px rgba(20,10,0,.35)">
          <sc-for list="{{tabs}}" as="t" hint-placeholder-count="4">
            <button role="tab" aria-selected="{{t.on}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
          </sc-for>
        </div>
      </div>
    </div>
  </header>

  <sc-if value="{{isAlloc}}" hint-placeholder-val="{{ false }}">
    <dc-import name="StrategicTrack" hint-size="100%,1500px"></dc-import>
  </sc-if>

  <main style="max-width: 1360px; margin: -64px auto 0; padding: 0 40px; display: flex; flex-direction: column; gap: 24px; box-sizing: border-box">

    <sc-if value="{{notCal}}" hint-placeholder-val="{{ true }}">

      <!-- SUMMARY (one frame) -->
      <section aria-label="Summary" style="background: #ffffff; border-radius: 24px; padding: 22px 26px; box-shadow: inset 0 1px 0 #ffffff, inset 0 0 0 1px rgba(98,79,61,.08), 0 8px 22px -12px rgba(98,79,61,.38); display: flex; flex-direction: column; gap: 16px">
        <div style="display: flex; justify-content: space-between; align-items: center; gap: 8px">
          
          <span style="font-size: 11px; font-weight: 500; color: #76634f; background: #f0e9d8; padding: 4px 10px; border-radius: 999px">{{scope}} · {{cmpShort}}</span>
        </div>
        <div style="display: flex; flex-wrap: wrap; gap: 0">
          <div style="flex: 1 1 240px; padding: 4px 24px 4px 0; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #76634f">TOTAL HEADCOUNT</span>
            <span style="font-size: 44px; line-height: 1; font-weight: 700; color: #a8791f">{{sum.hc}}</span>
            <span style="{{sum.hcStyle}}">{{sum.hcPct}}</span>
          </div>
          <div style="flex: 1 1 240px; padding: 4px 24px; border-left: 1px solid #e6dfcf; display: flex; flex-direction: column; gap: 8px">
            <span style="font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #76634f">TOTAL EXPENSE</span>
            <span style="font-size: 44px; line-height: 1; font-weight: 700; color: #a8791f">{{sum.exp}}</span>
            <span style="{{sum.expStyle}}">{{sum.expPct}}</span>
          </div>
          <div style="flex: 1 1 260px; padding: 4px 0 4px 24px; border-left: 1px solid #e6dfcf; display: flex; align-items: center; gap: 20px">
            <div style="display: flex; flex-direction: column; gap: 10px; flex: 1">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: .14em; color: #76634f">CASHABLE vs PLAYABLE</span>
              <sc-for list="{{donut.parts}}" as="p" hint-placeholder-count="2">
                <div style="display: flex; align-items: center; gap: 8px">
                  <span style="width: 10px; height: 10px; border-radius: 999px; background: {{p.color}}; flex: none"></span>
                  <span style="font-size: 12px; font-weight: 300; width: 64px">{{p.label}}</span>
                  <span style="font-size: 16px; font-weight: 700">{{p.amt}}</span>
                  <span style="font-size: 11px; font-weight: 300; color: #76634f">{{p.pct}}</span>
                </div>
              </sc-for>
            </div>
          </div>
        </div>
      </section>

      <!-- COMBO CHART -->
      <section aria-label="Trend" style="background: #ffffff; border-radius: 24px; padding: 22px 26px; box-shadow: inset 0 1px 0 #ffffff, inset 0 0 0 1px rgba(98,79,61,.08), 0 8px 22px -12px rgba(98,79,61,.38); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .1em">HEADCOUNT &amp; EXPENSE</h2>
            <span style="font-size: 11px; font-weight: 300; color: #76634f">{{chartSub}}</span>
          </div>
          <div role="group" aria-label="Breakdown" style="display: flex; gap: 3px; padding: 3px; border-radius: 999px; background: #f0e9d8">
            <sc-for list="{{splitBtns}}" as="b" hint-placeholder-count="3"><button aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button></sc-for>
          </div>
        </div>

        <div style="display: flex; justify-content: space-between; font-size: 10px; font-weight: 600; letter-spacing: .1em; color: #76634f; margin: 0 4px">
          <span>HEADCOUNT</span><span>EXPENSE</span>
        </div>
        <div style="position: relative; height: 260px; margin: 0 60px 0 52px">
          <sc-for list="{{grid}}" as="g" hint-placeholder-count="5">
            <div style="position: absolute; left: 0; right: 0; top: {{g.top}}; border-top: 1px solid #efe9dc"></div>
            <span style="position: absolute; left: -52px; width: 44px; text-align: right; top: {{g.labelTop}}; font-size: 10px; color: #76634f">{{g.left}}</span>
            <span style="position: absolute; right: -60px; width: 52px; text-align: left; top: {{g.labelTop}}; font-size: 10px; color: #76634f">{{g.right}}</span>
          </sc-for>
          <div style="{{barGridStyle}}">
            <sc-for list="{{bars}}" as="b" hint-placeholder-count="14">
              <div onMouseEnter="{{b.enter}}" onMouseLeave="{{hoverOut}}" style="{{b.colStyle}}">
                <div style="{{b.barStyle}}">
                  <sc-for list="{{b.segs}}" as="s" hint-placeholder-count="3"><div style="height: {{s.h}}; background: {{s.c}}; flex: none"></div></sc-for>
                </div>
              </div>
            </sc-for>
          </div>
          <svg viewBox="0 0 1000 260" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; top: 0; width: 100%; height: 100%; overflow: visible; pointer-events: none"><path d="{{lineD}}" fill="none" stroke="#3d3025" stroke-width="2" stroke-linejoin="round" vector-effect="non-scaling-stroke"></path></svg>
          <sc-for list="{{dots}}" as="d" hint-placeholder-count="14">
            <span style="{{d.style}}"></span>
          </sc-for>
          <sc-if value="{{tip.show}}" hint-placeholder-val="{{ false }}">
            <div role="status" style="{{tip.style}}">
              <span style="font-size: 11px; font-weight: 700; letter-spacing: .08em; color: #f8dd93">{{tip.label}}</span>
              <span style="display: flex; justify-content: space-between; gap: 16px; font-size: 12px"><span style="font-weight: 300">Headcount</span><span style="font-weight: 700">{{tip.hc}}</span></span>
              <span style="display: flex; justify-content: space-between; gap: 16px; font-size: 12px"><span style="font-weight: 300">Expense</span><span style="font-weight: 700">{{tip.exp}}</span></span>
              <sc-for list="{{tip.segs}}" as="t" hint-placeholder-count="0">
                <span style="display: flex; align-items: center; gap: 6px; font-size: 11px"><span style="width: 8px; height: 8px; border-radius: 2px; background: {{t.c}}"></span><span style="font-weight: 300; flex: 1">{{t.name}}</span><span style="font-weight: 600">{{t.v}}</span></span>
              </sc-for>
            </div>
          </sc-if>
        </div>
        <div style="{{xGridStyle}}">
          <sc-for list="{{xLabels}}" as="x" hint-placeholder-count="14"><span style="display: flex; justify-content: center"><span style="{{x.style}}">{{x.text}}</span></span></sc-for>
        </div>

        <div style="display: flex; flex-wrap: wrap; gap: 6px 14px; align-items: center; border-top: 1px solid #efe9dc; padding-top: 12px; font-size: 11px; color: #76634f">
          <sc-for list="{{legend}}" as="l" hint-placeholder-count="6">
            <span style="display: flex; align-items: center; gap: 6px"><span style="width: 10px; height: 10px; border-radius: 3px; background: {{l.c}}"></span>{{l.name}}</span>
          </sc-for>
          <span style="display: flex; align-items: center; gap: 6px; margin-left: auto"><span style="width: 18px; height: 2px; background: #3d3025"></span>Expense (right axis)</span>
        </div>
      </section>

      <!-- EXPENSE BY TYPE -->
      <section aria-label="Expense by type" style="display: flex; flex-direction: column; gap: 12px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: flex-end; gap: 10px; padding: 0 4px">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .1em">EXPENSE BY TYPE</h2>
            <span style="font-size: 11px; font-weight: 300; color: #76634f">{{scope}}</span>
          </div>
          <button onClick="{{toggleAll}}" style="border: 0; cursor: pointer; padding: 8px 14px; min-height: 36px; border-radius: 999px; font-size: 12px; font-weight: 600; color: #4d3d2e; background: #ffffff; box-shadow: inset 0 0 0 1px rgba(98,79,61,.12)">{{toggleAllLabel}}</button>
        </div>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(340px, 1fr)); gap: 20px; align-items: start">
          <sc-for list="{{panels}}" as="pn" hint-placeholder-count="3">
            <div style="background: #ffffff; border-radius: 24px; padding: 6px 22px; box-shadow: inset 0 1px 0 #ffffff, inset 0 0 0 1px rgba(98,79,61,.08), 0 8px 22px -12px rgba(98,79,61,.38); display: flex; flex-direction: column">
              <sc-for list="{{pn.groups}}" as="g" hint-placeholder-count="2">
                <div style="{{g.wrapStyle}}">
                  <button onClick="{{g.toggle}}" aria-expanded="{{g.open}}" style="border: 0; cursor: pointer; background: transparent; color: #4d3d2e; text-align: left; display: flex; flex-direction: column; gap: 10px; padding: 16px 0; width: 100%">
                    <span style="display: flex; align-items: center; gap: 10px; width: 100%">
                      <span style="{{g.badge}}">{{g.letter}}</span>
                      <span style="flex: 1; min-width: 0; font-size: 13px; font-weight: 700; line-height: 1.3">{{g.title}}</span>
                      <svg width="10" height="10" viewBox="0 0 10 10" aria-hidden="true" style="{{g.chevStyle}}"><path d="M3 1 L7 5 L3 9" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    </span>
                    <span style="display: flex; align-items: baseline; gap: 10px; width: 100%">
                      <span style="font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums">{{g.amt}}</span>
                      <span style="{{g.pctStyle}}">{{g.pct}}</span>
                      <span style="margin-left: auto; font-size: 11px; font-weight: 600; color: #76634f">{{g.share}} of total</span>
                    </span>
                    <span style="display: block; width: 100%; height: 8px; border-radius: 999px; background: #f0e9d8; overflow: hidden"><span style="display: block; height: 100%; width: {{g.share}}; border-radius: 999px; background: linear-gradient(90deg,#f8dd93,#dcae48)"></span></span>
                  </button>
                  <sc-if value="{{g.isOpen}}" hint-placeholder-val="{{ false }}">
                    <div style="display: flex; flex-direction: column; background: #faf8f4; border-radius: 14px; padding: 6px 14px; margin-bottom: 14px">
                      <sc-for list="{{g.items}}" as="it" hint-placeholder-count="3">
                        <div style="display: flex; flex-direction: column">
                          <button onClick="{{it.toggle}}" aria-expanded="{{it.open}}" style="border: 0; cursor: pointer; background: transparent; color: #4d3d2e; text-align: left; display: flex; flex-direction: column; gap: 6px; padding: 8px 0; width: 100%; font-family: inherit">
                            <span style="display: flex; align-items: center; gap: 10px; font-size: 13px; width: 100%">
                              <svg width="8" height="8" viewBox="0 0 10 10" aria-hidden="true" style="{{it.chevStyle}}"><path d="M3 1 L7 5 L3 9" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                              <span style="flex: 1; font-weight: 300">{{it.name}}</span>
                              <span style="font-weight: 600; font-variant-numeric: tabular-nums">{{it.amt}}</span>
                              <span style="{{it.pctStyle}}">{{it.pct}}</span>
                            </span>
                            <span style="display: flex; align-items: center; gap: 12px; width: 100%; padding-left: 18px; box-sizing: border-box">
                              <span style="flex: 1; height: 5px; border-radius: 999px; background: #efe9dc; overflow: hidden"><span style="display: block; height: 100%; width: {{it.share}}; border-radius: 999px; background: #c4b799"></span></span>
                              <span style="width: 92px; text-align: right; font-size: 10px; font-weight: 300; color: #76634f">{{it.share}} of total</span>
                            </span>
                          </button>
                          <sc-if value="{{it.isOpen}}" hint-placeholder-val="{{ false }}">
                            <div style="display: flex; flex-direction: column; gap: 2px; margin: 2px 0 8px 18px; padding: 6px 12px; border-radius: 12px; background: #ffffff; box-shadow: inset 0 0 0 1px #efe9dc">
                              <sc-for list="{{it.subs}}" as="sb" hint-placeholder-count="3">
                                <div style="display: flex; align-items: center; gap: 10px; padding: 5px 0; font-size: 12px">
                                  <span style="width: 6px; height: 6px; border-radius: 999px; background: #c4b799; flex: none"></span>
                                  <span style="flex: 1; font-weight: 300">{{sb.name}}</span>
                                  <span style="font-weight: 600; font-variant-numeric: tabular-nums">{{sb.amt}}</span>
                                  <span style="width: 64px; text-align: right; font-size: 10px; font-weight: 300; color: #76634f">{{sb.share}} of {{it.code}}</span>
                                </div>
                              </sc-for>
                            </div>
                          </sc-if>
                        </div>
                      </sc-for>
                    </div>
                  </sc-if>
                </div>
              </sc-for>
            </div>
          </sc-for>
        </div>
      </section>

      <!-- TOP 5 -->
      <section aria-label="Top players" style="background: #ffffff; border-radius: 24px; padding: 22px 26px; box-shadow: inset 0 1px 0 #ffffff, inset 0 0 0 1px rgba(98,79,61,.08), 0 8px 22px -12px rgba(98,79,61,.38); display: flex; flex-wrap: wrap; gap: 20px 40px">
        <sc-for list="{{tops}}" as="t" hint-placeholder-count="2">
          <div style="flex: 1 1 420px; min-width: 0; display: flex; flex-direction: column">
            <h2 style="margin: 0 0 10px; font-size: 16px; font-weight: 700; letter-spacing: .1em">{{t.title}} <span style="font-size: 11px; font-weight: 300; letter-spacing: 0; color: #76634f">· {{scope}}</span></h2>
            <div style="display: grid; grid-template-columns: 24px 80px 64px minmax(0, 1fr) 100px; gap: 12px; font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #76634f; padding-bottom: 8px; border-bottom: 1px solid #e6dfcf">
              <span>#</span><span>MB#</span><span>TIER</span><span>NATIONALITY</span><span style="text-align: right">{{t.col}}</span>
            </div>
            <sc-for list="{{t.list}}" as="p" hint-placeholder-count="5">
              <div style="display: grid; grid-template-columns: 24px 80px 64px minmax(0, 1fr) 100px; gap: 12px; align-items: center; font-size: 13px; padding: 9px 0; border-bottom: 1px solid #efe9dc">
                <span style="font-weight: 700; color: #624f3d">{{p.rank}}</span>
                <span style="font-variant-numeric: tabular-nums">{{p.mb}}</span>
                <span style="{{p.tierStyle}}">{{p.tier}}</span>
                <span style="font-weight: 300">{{p.nat}}</span>
                <span style="text-align: right; font-weight: 700; font-variant-numeric: tabular-nums">{{p.amt}}</span>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </section>
    </sc-if>

    <!-- CALENDAR (one frame) -->
    <sc-if value="{{isCal}}" hint-placeholder-val="{{ false }}">
      <section aria-label="Calendar" style="background: #ffffff; border-radius: 24px; padding: 22px 26px; box-shadow: inset 0 1px 0 #ffffff, inset 0 0 0 1px rgba(98,79,61,.08), 0 8px 22px -12px rgba(98,79,61,.38); display: flex; flex-direction: column; gap: 14px">
        <div style="display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 12px">
          <div style="display: flex; flex-direction: column; gap: 3px">
            <h2 style="margin: 0; font-size: 16px; font-weight: 700; letter-spacing: .1em">{{calTitle}}</h2>
            <span style="font-size: 11px; font-weight: 300; color: #76634f">{{calSub}}</span>
          </div>
          <div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
            <span style="display: flex; align-items: center; gap: 6px; font-size: 10px; color: #76634f">
              <span>Low</span>
              <sc-for list="{{shadeKey}}" as="k" hint-placeholder-count="4"><span style="width: 14px; height: 8px; border-radius: 999px; background: {{k}}"></span></sc-for>
              <span>High</span>
            </span>
            <div role="group" aria-label="Shade by" style="display: flex; gap: 3px; padding: 3px; border-radius: 999px; background: #f0e9d8">
              <sc-for list="{{calMetricBtns}}" as="b" hint-placeholder-count="2"><button aria-pressed="{{b.on}}" onClick="{{b.pick}}" style="{{b.style}}">{{b.label}}</button></sc-for>
            </div>
          </div>
        </div>
        <div role="tablist" aria-label="Month" style="display: flex; gap: 4px; overflow-x: auto; padding: 3px; border-radius: 999px; background: #faf8f4; box-shadow: inset 0 0 0 1px #efe9dc">
          <sc-for list="{{monthTabs}}" as="m" hint-placeholder-count="12"><button role="tab" aria-selected="{{m.on}}" disabled="{{m.future}}" onClick="{{m.pick}}" style="{{m.style}}">{{m.label}}</button></sc-for>
        </div>
        <div style="display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 6px">
          <sc-for list="{{weekdays}}" as="w" hint-placeholder-count="7"><span style="font-size: 10px; font-weight: 700; letter-spacing: .1em; color: #76634f; text-align: center; padding-bottom: 2px">{{w}}</span></sc-for>
          <sc-for list="{{cal}}" as="d" hint-placeholder-count="35">
            <div title="{{d.tip}}" style="{{d.style}}">
              <span style="display: flex; justify-content: space-between; align-items: center; font-size: 10px; font-weight: 600"><span>{{d.n}}</span><sc-if value="{{d.today}}" hint-placeholder-val="{{ false }}"><span style="font-size: 9px; font-weight: 700; letter-spacing: .08em; padding: 2px 6px; border-radius: 999px; background: #3d3025; color: #ffffff">TODAY</span></sc-if></span>
              <span style="{{d.mainStyle}}">{{d.main}}</span>
              <span style="font-size: 10px; font-weight: 300">{{d.sub}}</span>
            </div>
          </sc-for>
        </div>
      </section>
    </sc-if>

  </main>
</div>
</template>
<template id="tpl-StrategicTrack">

<div style="width: 100%; min-height: 1500px; box-sizing: border-box; font-family: Montserrat, sans-serif; background: linear-gradient(180deg, #efede7 0%, #faf8f4 100%); color: #4d3d2e">

<header style="background: radial-gradient(circle at 88% 0%, rgba(241,202,109,0.20) 0, rgba(241,202,109,0) 40%), linear-gradient(180deg, #624f3d 0%, #4b3b2d 60%, #3d3025 100%); padding: 22px 32px 26px; box-shadow: 0 22px 44px -26px rgba(60,40,20,.65)">
<div style="max-width: 1360px; margin: 0 auto; display: flex; flex-direction: column; gap: 18px">
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; flex-direction: column; gap: 4px">
<h1 style="margin: 0; font-size: 26px; font-weight: 700; letter-spacing: 1px; color: #ffffff">STRATEGIC TRACK</h1>
<span style="display: flex; align-items: center; gap: 8px; font-size: 12px; font-weight: 500; color: rgba(255,255,255,.88)">Updated Nov 19, 2026&nbsp;</span>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 14px">
<div style="display: flex; padding: 4px; border-radius: 999px; background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.14)">
<sc-for list="{{periods}}" as="p" hint-placeholder-count="3">
<button onClick="{{p.pick}}" style="{{p.style}}">{{p.label}}</button>
</sc-for>
</div>
<button role="switch" aria-checked="{{incDStr}}" onClick="{{toggleD}}" style="display: flex; align-items: center; gap: 10px; height: 42px; padding: 0 16px 0 6px; border: 0; border-radius: 999px; background: rgba(255,255,255,.12); box-shadow: inset 0 1px 0 rgba(255,255,255,.45), inset 0 0 0 1px rgba(255,255,255,.14); color: #ffffff; font-family: Montserrat, sans-serif; font-size: 13px; font-weight: 600; cursor: pointer">
<span style="{{switchTrack}}"><span style="{{switchKnob}}"></span></span>
Include Hidden Jackpot
</button>
</div>

};
});

// share-of-spend ring beside the pace map
var RING_C = 2 * Math.PI * 52, ringCum = 0;
var ring = gKeys.map(function (g) {
var gs = items.filter(function (x) { return x.g === g; }).reduce(function (s, x) { return s + x.share; }, 0);
var p = gs / totalShare * 100, len = RING_C * p / 100;
var seg = { letter: g, short: GROUPS[g].short, pct: Math.round(p) + "%", color: GROUPS[g].color,

});
// keep labels on the same side at least 58px apart, then draw leaders and place labels
[true, false].forEach(function (side) {
var list = ring.filter(function (r) { return r._c.right === side; }).sort(function (a, b) { return a._c.ly - b._c.ly; });
for (var k = 1; k < list.length; k++) { if (list[k]._c.ly - list[k - 1]._c.ly < 58) list[k]._c.ly = list[k - 1]._c.ly + 58; }
for (var j = list.length - 1; j >= 0; j--) { var lim = j === list.length - 1 ? 292 : list[j + 1]._c.ly - 58; if (list[j]._c.ly > lim) list[j]._c.ly = lim; if (list[j]._c.ly < 28) list[j]._c.ly = 28; }
});
ring.forEach(function (seg) {
var c = seg._c, CX = 280, ex = CX + (c.right ? 150 : -150);
seg.lead = "M" + c.sx.toFixed(1) + " " + c.sy.toFixed(1) + " L" + (CX + 128 * Math.cos(c.mid)).toFixed(1) + " " + c.ly.toFixed(1) + " H" + ex;
seg.labelStyle = "position:absolute;width:120px;display:flex;flex-direction:column;gap:4px;cursor:default;top:" + c.ly.toFixed(1) + "px;transform:translateY(-50%);" + (c.right ? "left:" + (ex + 8) + "px;align-items:flex-start;text-align:left" : "left:" + (ex - 128) + "px;align-items:flex-end;text-align:right");

});
var ringNone = { color: "none", w: "0", dash: "0 999", off: "0", lead: "", hover: clearHov };
var priorityList = ALL.filter(function (x) { return PRIORITY[x.id] && (incD || x.g !== "D"); }).map(function (x) {
var st = statusOf(x);
return { label: "★ " + x.id + " " + x.name + " · " + st.label, style: "font-size:11px;font-weight:700;padding:5px 10px;border-radius:12px;line-height:1.35;max-width:100%;box-sizing:border-box;" + (st.k === "on" ? "background:#dcae48;color:#3d3025" : "background:#f8dd93;color:#3d3025;box-shadow:inset 0 0 0 2px #ffffff") };
});

// sample budget (USD): A–C $3.59M / month, Hidden Jackpot $0.70M / month
var MONTH_BUDGET = incD ? 4290000 : 3590000;
var budgetAmt = MONTH_BUDGET * ({ Week: 12 / 52, Month: 1, YTD: 11 }[self.state.period] || 1);
function money(v) { return v >= 1e6 ? "$" + (v / 1e6).toFixed(2) + "M" : "$" + Math.round(v / 1e3) + "K"; }
var periods = ["Week", "Month", "YTD"].map(function (p) {
var on = self.state.period === p;
return {

pick: function () { self.setState({ period: p }); },
style: "height:34px;padding:0 18px;border:0;border-radius:999px;cursor:pointer;font-family:Montserrat,sans-serif;font-size:13px;" + (on ? "font-weight:600;background:#ffffff;color:#4d3d2e;box-shadow:inset 0 1px 0 #ffffff,0 2px 10px rgba(40,25,10,.2)" : "font-weight:500;background:transparent;color:rgba(255,255,255,.88)")
};
});

return {
